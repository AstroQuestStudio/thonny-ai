[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thonny-ai"
version = "0.1.1"
description = "MCP server and Thonny plugin: let Claude Code or any AI agent program Raspberry Pi Pico and ESP32 boards in MicroPython, visibly and with approval."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mathis Cottereau" }]
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]
keywords = [
    "thonny", "thonny-plugin", "micropython", "mcp", "mcp-server", "model-context-protocol",
    "claude", "claude-code", "raspberry-pi-pico", "pico-w", "rp2040", "esp32", "ai-agent",
    "education", "robotics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Framework :: Thonny",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Education",
    "Topic :: Software Development :: Embedded Systems",
]

[project.urls]
Homepage = "https://github.com/AstroQuestStudio/thonny-ai"
Documentation = "https://github.com/AstroQuestStudio/thonny-ai#readme"
Issues = "https://github.com/AstroQuestStudio/thonny-ai/issues"
Changelog = "https://github.com/AstroQuestStudio/thonny-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["thonny>=4.1"]

[project.scripts]
thonny-ai-mcp = "thonny_ai_mcp.server:main"

[tool.setuptools.packages.find]
include = ["thonnycontrib*", "thonny_ai_mcp*"]
namespaces = true

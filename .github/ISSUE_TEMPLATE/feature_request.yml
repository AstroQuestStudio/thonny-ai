name: Feature request
description: An idea to make thonny-ai better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation (classroom, project, board…) rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: help
    attributes:
      label: Would you like to implement it?
      options:
        - "Yes"
        - With some guidance
        - "No"
